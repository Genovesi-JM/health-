name: Kaya technical checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: technical-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.phase0.lock
      - run: python -m pip install --require-hashes -r backend/requirements.phase0.lock
      - name: Generated market policy and script regressions
        run: |
          python scripts/generate_kaya_policy.py --check
          python -m pytest scripts/tests/test_kaya_phase1_scope.py scripts/tests/test_kaya_phase1_inventory.py -q
      - name: Backend regression suite (synthetic SQLite data)
        env:
          ENV: test
          KAYA_EXECUTION_MODE: synthetic
          KAYA_DISABLE_RATE_LIMIT: '1'
          SECRET_KEY: synthetic-ci-signing-key-not-for-production
          DATABASE_URL: sqlite:////tmp/kaya-ci-main.db
          ACCOUNTS_DATABASE_URL: sqlite:////tmp/kaya-ci-accounts.db
        run: |
          python scripts/kaya_phase0_backend.py /tmp/kaya-ci-backend --checks backend-full backend-focused
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('/tmp/kaya-ci-backend/results/summary.json').read_text())
          required = {'clean-install', 'dependency-consistency', 'backend-full', 'backend-focused'}
          if not required <= report.keys():
              raise SystemExit('Backend isolation report is incomplete')
          failed = {name: result for name, result in report.items()
                    if result.get('exit_code') != 0 or result.get('timed_out')}
          if failed:
              raise SystemExit('Backend isolated checks failed: ' + json.dumps(failed))
          PY
      - name: Staging schema and HOLD regressions (no live services)
        run: python -m pytest backend/staging_tests backend/security_tests/test_docker_allowlist.py -q
      - name: Retain isolated backend reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: backend-isolated-regressions
          path: /tmp/kaya-ci-backend/results/
          if-no-files-found: warn

  postgres-coordination:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version-file: '.python-version'
          cache: pip
          cache-dependency-path: backend/requirements.phase0.lock
      - name: Install locked backend validation dependencies
        run: python -m pip install --require-hashes -r backend/requirements.phase0.lock
      - name: Install local PostgreSQL binaries
        run: sudo apt-get update && sudo apt-get install -y postgresql libpq-dev
      - name: Run isolated database races
        env:
          TMPDIR: /tmp
        run: python scripts/kaya_validate_postgres.py --postgres-bin "$(pg_config --bindir)"
      - name: Retain synthetic concurrency report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: postgresql-coordination
          path: |
            /tmp/kaya-pg-scheduling-*/report.json
            /tmp/kaya-pg-scheduling-*/validation.log
          if-no-files-found: warn

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test -- --maxWorkers=2
      - run: npm run lint
      - run: npm run build

  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
