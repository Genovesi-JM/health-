name: Kaya technical checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: technical-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - name: Generated market policy and script regressions
        run: |
          python scripts/generate_kaya_policy.py --check
          python -m pytest scripts/tests/test_kaya_phase1_scope.py scripts/tests/test_kaya_phase1_inventory.py -q
      - name: Backend regression suite (synthetic SQLite data)
        env:
          ENV: test
          KAYA_EXECUTION_MODE: synthetic
          KAYA_DISABLE_RATE_LIMIT: '1'
          SECRET_KEY: synthetic-ci-signing-key-not-for-production
          DATABASE_URL: sqlite:////tmp/kaya-ci-main.db
          ACCOUNTS_DATABASE_URL: sqlite:////tmp/kaya-ci-accounts.db
        run: python -m pytest backend/tests -q --disable-warnings

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test -- --maxWorkers=2 --minWorkers=1
      - run: npm run build

  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
